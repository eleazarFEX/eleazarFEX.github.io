<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8C6C0">
<title>Estrellita Mis XV · Bellos recuerdos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flor" viewBox="-50 -50 100 100">
    <g fill="currentColor">
      <ellipse cx="0" cy="-24" rx="12" ry="24"/>
      <ellipse cx="0" cy="-24" rx="12" ry="24" transform="rotate(72)"/>
      <ellipse cx="0" cy="-24" rx="12" ry="24" transform="rotate(144)"/>
      <ellipse cx="0" cy="-24" rx="12" ry="24" transform="rotate(216)"/>
      <ellipse cx="0" cy="-24" rx="12" ry="24" transform="rotate(288)"/>
    </g>
    <circle r="8" fill="#B8924A"/>
  </symbol>
</svg>

<!-- PORTADA -->
<section id="portada" aria-label="Portada">
  <svg class="flor f1" aria-hidden="true"><use href="#flor"/></svg>
  <svg class="flor f2" aria-hidden="true"><use href="#flor"/></svg>
  <svg class="flor f3" aria-hidden="true"><use href="#flor"/></svg>
  <svg class="flor f4" aria-hidden="true"><use href="#flor"/></svg>
  <div class="contenido">
    <h1 class="nombre">Estrellita Mis XV</h1>
    <p class="subtitulo">Bellos recuerdos</p>
    <button id="btnAbrir" class="btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.3 5.2 7.8 4.6 4 4.8v13c3.8-.2 6.3.4 8 1.7 1.7-1.300 4.2-1.900 8-1.700v-13c-3.800-.200-6.300.4-8 1.700z"/><path d="M12 6.500v13"/></svg>
      Abrir mi álbum
    </button>
  </div>
</section>

<!-- ÁLBUM -->
<main id="app" hidden>
  <header class="barra">
    <button id="btnPortada" class="ib" type="button" aria-label="Volver a la portada" title="Volver a la portada">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>
    </button>
    <span class="esp"></span>
    <input id="volumen" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Volumen de la música">
    <button id="btnMusica" class="ib" type="button" aria-pressed="false" aria-label="Reproducir música" title="Música">
      <svg class="on-i" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.500 8.500a5 5 0 0 1 0 7"/><path d="M19 6a8.500 8.500 0 0 1 0 12"/></svg>
      <svg class="off-i" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <button id="btnPantalla" class="ib" type="button" aria-label="Pantalla completa" title="Pantalla completa">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>

  <div class="escenario"><div id="libro" class="libro" aria-live="polite"></div></div>

  <nav class="nav" aria-label="Navegación del álbum">
    <button id="btnPrev" class="ib grande" type="button" aria-label="Página anterior">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span id="indicador" class="ind">Página 1</span>
    <button id="btnNext" class="ib grande" type="button" aria-label="Página siguiente">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
</main>

<div id="aviso" class="aviso" role="status"></div>
<audio id="musica" src="musica.mp3" loop preload="none"></audio>

<!-- Página final: edita aquí el mensaje y la firma -->
<template id="tplFinal">
  <div class="final">
    <p class="msg">Los momentos más bonitos se convierten en recuerdos eternos. Gracias por ser parte de esta historia tan especial.</p>
    <svg class="corazon" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="#C98E8E" stroke="#B8924A" stroke-width=".8" d="M12 20.500C5 15.500 3 12 3 9a4.800 4.800 0 0 1 9-2.300A4.800 4.800 0 0 1 21 9c0 3-2 6.500-9 11.500z"/></svg>
    <button class="btn mini reiniciar" type="button">Ver el álbum desde el principio</button>
    <div class="firma"><strong>FOTO CLIC</strong><span>7491040729</span></div>
  </div>
</template>

<script src="script.js"></script>
</body>
</html>
